name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Toy example (dry run, no API key)
        run: bash examples/toy/run_toy.sh dry "${{ runner.temp }}/toy_output"
